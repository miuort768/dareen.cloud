# ============================================================================
# DoS / DDoS Protection — dareen.cloud (Nginx reverse-proxy layer)
# ============================================================================
# التطبيق: انسخ هذا الملف إلى /etc/nginx/dareen-dos.conf ثم ضمن server block:
#   sudo cp deploy/nginx-dos-protection.conf /etc/nginx/dareen-dos.conf
#   # داخل /etc/nginx/sites-available/dareen.cloud أضف داخل server {}:
#   include /etc/nginx/dareen-dos.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# ملاحظة: limit_req_zone / limit_conn_zone يجب أن تكون في http {} — إن وُجدت
# تعريفات سابقة بنفس الاسم سيظهر خطأ "duplicate zone"، أزل التعريف القديم.
# ============================================================================

# ── Zones (تُعرّف مرة واحدة على مستوى http) ────────────────────────────────
# سلة عامة: 20 طلب/ثانية لكل IP مع burst 40
limit_req_zone $binary_remote_addr zone=dareen_general:16m rate=20r/s;
# سلة صارمة لمسارات المصادقة: 5 محاولات/دقيقة لكل IP (brute-force + credential stuffing)
limit_req_zone $binary_remote_addr zone=dareen_auth:16m rate=5r/m;
# حد الاتصالات المتزامنة: 50 لكل IP
limit_conn_zone $binary_remote_addr zone=dareen_conn:16m;

# إرجاع 429 بدل الصفحة الافتراضية
limit_req_status 429;
limit_conn_status 429;

server {
    # ── حدود الاتصالات ──────────────────────────────────────────────────
    limit_conn dareen_conn 50;

    # ── Slowloris: إغلاق الاتصالات البطيئة بسرعة ────────────────────────
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          20s;
    keepalive_timeout     15s;

    # ── حدود حجم الجسم: رفع الملفات عبر /api/upload فقط (50MB) ─────────
    client_max_body_size 1m;

    location /api/upload {
        client_max_body_size 50m;
        proxy_pass http://localhost:8080;
        include /etc/nginx/proxy_params;
    }

    location /api/system/restore {
        client_max_body_size 60m;
        proxy_pass http://localhost:8080;
        include /etc/nginx/proxy_params;
    }

    # ── مسارات المصادقة: حد صارم ────────────────────────────────────────
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=dareen_auth burst=10 nodelay;
        proxy_pass http://localhost:8080;
        include /etc/nginx/proxy_params;
    }

    # ── WebSocket (socket.io + livekit): بدون limit_req لأنه اتصال طويل ─
    location /api/socket.io {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ── باقي الـ API: الحد العام ────────────────────────────────────────
    location /api/ {
        limit_req zone=dareen_general burst=40 nodelay;
        proxy_pass http://localhost:8080;
        include /etc/nginx/proxy_params;
    }

    # ── الأصول الثابتة: cache قوي يقلل الحمل أثناء الهجمات ──────────────
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
        proxy_pass http://localhost:8080;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── حجب ماسحات الثغرات الشائعة (توفير الموارد) ──────────────────────
    location ~* /\.(git|env|htaccess) { return 404; }
    location ~* (wp-admin|wp-login|\.php)$ { return 404; }
}

# ============================================================================
# خطوة إضافية موصى بها على الـ VPS (fail2ban — حجب تلقائي على مستوى iptables):
#
#   sudo apt install fail2ban -y
#   sudo tee /etc/fail2ban/jail.local <<'EOF'
#   [nginx-limit-req]
#   enabled  = true
#   filter   = nginx-limit-req
#   logpath  = /var/log/nginx/error.log
#   maxretry = 20
#   findtime = 60
#   bantime  = 3600
#
#   [nginx-botsearch]
#   enabled  = true
#   logpath  = /var/log/nginx/access.log
#   maxretry = 10
#   bantime  = 86400
#   EOF
#   sudo systemctl restart fail2ban
#
# للهجمات الحجمية الكبيرة (L3/L4 volumetric) الحل الوحيد هو CDN/scrubbing:
#   - تفعيل Cloudflare (مجاني) أمام dareen.cloud + "Under Attack Mode" عند الحاجة
#   - أو تفعيل DDoS protection لدى Hostinger إن كانت متاحة في خطتك
# ============================================================================
