services:
  app:
    build:
      context: .
      args:
        - VITE_API_URL=/api
        - VITE_LIVEKIT_URL=${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: darin-app
    restart: always
    ports:
      - "8080:3001"
      - "3005:3005"
    volumes:
      - app_data:/database
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/database/database.sqlite
      - DATABASE_URL=${DATABASE_URL:-postgresql://darin:${DB_PASSWORD}@postgres:5432/darin}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FRONTEND_URL=${FRONTEND_URL:-https://dareen.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: always
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}

  postgres:
    image: postgres:16-alpine
    container_name: darin-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: darin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: darin
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darin -d darin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: darin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  app_data:
  pg_data:
  redis_data:
