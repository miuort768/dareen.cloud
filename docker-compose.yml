services:
  app:
    build:
      context: .
      args:
        - VITE_API_URL=/api
    container_name: darin-app
    restart: always
    ports:
      - "3001:3001"
      - "3005:3005"
    volumes:
      - app_data:/database
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/database/database.sqlite
      - JWT_SECRET=${JWT_SECRET:-d3a8e9b1c7f4e8d2a6b5c4d3e2f1a0b9}
      - FRONTEND_URL=${FRONTEND_URL:-*}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
