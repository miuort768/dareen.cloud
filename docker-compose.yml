services:
  app:
    build:
      context: .
      args:
        - VITE_API_URL=/api
        - VITE_LIVEKIT_URL=${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: darin-app
    restart: always
    ports:
      - "8080:3001"
      - "3005:3005"
    volumes:
      - app_data:/database
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/database/database.sqlite
      - DATABASE_URL=file:/database/dev.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FRONTEND_URL=${FRONTEND_URL:-https://dareen.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    depends_on:
      - livekit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: always
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}

volumes:
  app_data:
