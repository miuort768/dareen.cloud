services:
  app:
    build:
      context: .
      args:
        - VITE_API_URL=/api
        - VITE_LIVEKIT_URL=${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: darin-app
    restart: always
    ports:
      - "3001:3001"
      - "3005:3005"
    volumes:
      - app_data:/database
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/database/database.sqlite
      - JWT_SECRET=${JWT_SECRET:-d3a8e9b1c7f4e8d2a6b5c4d3e2f1a0b9}
      - FRONTEND_URL=${FRONTEND_URL:-*}
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - livekit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: always
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret

volumes:
  app_data:
