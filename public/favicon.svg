<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow/base layer -->
  <rect x="10" y="45" width="80" height="40" rx="10" ry="10" fill="#5b21b6" opacity="0.5"/>
  
  <!-- Main body of cap -->
  <rect x="12" y="38" width="76" height="38" rx="10" ry="10" fill="#8b5cf6"/>
  
  <!-- Top highlight -->
  <rect x="12" y="38" width="76" height="12" rx="10" ry="10" fill="#a78bfa"/>
  
  <!-- Inner top dark area to show depth -->
  <rect x="18" y="44" width="64" height="6" rx="3" fill="#7c3aed" opacity="0.6"/>
  
  <!-- Tassel cord - horizontal part -->
  <line x1="22" y1="52" x2="22" y2="38" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="38" x2="22" y2="38" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tassel dangling part -->
  <line x1="10" y1="38" x2="10" y2="55" stroke="#5b21b6" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tassel end knob -->
  <rect x="7" y="55" width="7" height="9" rx="3" fill="#4c1d95"/>
  
  <!-- Top flat board -->
  <rect x="8" y="30" width="84" height="12" rx="4" ry="4" fill="#9333ea"/>
  
  <!-- Shine line on top board -->
  <rect x="14" y="32" width="55" height="3" rx="2" fill="#c084fc" opacity="0.5"/>
</svg>
